# Deploy config for Netlify (also works as-is on Cloudflare Pages / Vercel,
# which auto-detect Astro static output).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Long-cache the hashed, immutable build assets
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 301 the interim SEO URL to the canonical /services/search-engine-optimization/
# (the URL that carries the historical equity/backlinks). Preserves link value.
[[redirects]]
  from = "/services/seo"
  to = "/services/search-engine-optimization/"
  status = 301
  force = true

[[redirects]]
  from = "/services/seo/"
  to = "/services/search-engine-optimization/"
  status = 301
  force = true

# Legacy WordPress URLs → their new homes (preserve equity from indexed pages)
[[redirects]]
  from = "/national-seo/"
  to = "/services/search-engine-optimization/national-seo/"
  status = 301
  force = true

[[redirects]]
  from = "/national-seo"
  to = "/services/search-engine-optimization/national-seo/"
  status = 301
  force = true

[[redirects]]
  from = "/contact/"
  to = "/#contact"
  status = 301
  force = true

[[redirects]]
  from = "/contact"
  to = "/#contact"
  status = 301
  force = true

[[redirects]]
  from = "/services/web-development/"
  to = "/#services"
  status = 301
  force = true

[[redirects]]
  from = "/services/web-development"
  to = "/#services"
  status = 301
  force = true

[[redirects]]
  from = "/services/"
  to = "/#services"
  status = 301
  force = true

[[redirects]]
  from = "/about-growth-local/"
  to = "/team/"
  status = 301
  force = true

[[redirects]]
  from = "/about-growth-local"
  to = "/team/"
  status = 301
  force = true
